[project]
name = "navarena-server"
dynamic = ["version"]
description = "Lightweight WebSocket model-server SDK for NavArena agent developers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "NavArena", email = "jake@navarena.com"}
]
keywords = ["navigation", "websocket", "model-server", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "websockets>=12.0",
    "msgpack>=1.0",
    "anyio>=4.0",
    "numpy",
    "Pillow",
]

[project.urls]
Repository = "https://github.com/EI-Nav/NavArena-Server"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "navarena_server._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["navarena_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
